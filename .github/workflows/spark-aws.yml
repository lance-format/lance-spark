name: Spark AWS Integration

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request_target:
    types:
      - opened
      - synchronize
      - ready_for_review
      - reopened
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # This env var is used by Swatinem/rust-cache@v2 for the cache
  # key, so we set it to make sure it is always consistent.
  CARGO_TERM_COLOR: always
  # Disable full debug symbol generation to speed up CI build and keep memory down.
  RUSTFLAGS: "-C debuginfo=1"
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"

jobs:
  glue-s3-integration-test:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    name: Glue/S3 Docker Test Spark ${{ matrix.spark-version }} / Scala ${{ matrix.scala-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - spark-version: "3.4"
            scala-version: "2.12"
            test-backends: "glue"
          - spark-version: "3.4"
            scala-version: "2.13"
            test-backends: "glue"
          - spark-version: "3.5"
            scala-version: "2.12"
            test-backends: "glue"
          - spark-version: "3.5"
            scala-version: "2.13"
            test-backends: "glue"
          - spark-version: "4.0"
            scala-version: "2.13"
            test-backends: "glue"
          - spark-version: "4.1"
            scala-version: "2.13"
            test-backends: "glue"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: "maven"
      - name: Resolve Docker build args
        id: docker-args
        run: |
          make print-docker-build-args SPARK_VERSION=${{ matrix.spark-version }} SCALA_VERSION=${{ matrix.scala-version }} >> $GITHUB_OUTPUT
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build test-base image (cached)
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile.test-base
          load: true
          tags: lance-spark-test-base:${{ matrix.spark-version }}_${{ matrix.scala-version }}
          build-args: |
            SPARK_DOWNLOAD_VERSION=${{ steps.docker-args.outputs.spark-download-version }}
            SPARK_MAJOR_VERSION=${{ matrix.spark-version }}
            SCALA_VERSION=${{ matrix.scala-version }}
            PY4J_VERSION=${{ steps.docker-args.outputs.py4j-version }}
            SPARK_SCALA_SUFFIX=${{ steps.docker-args.outputs.spark-scala-suffix }}
          cache-from: type=gha,scope=test-base-${{ matrix.spark-version }}_${{ matrix.scala-version }}
          cache-to: type=gha,mode=max,scope=test-base-${{ matrix.spark-version }}_${{ matrix.scala-version }}
      - name: Build bundle
        run: make bundle SPARK_VERSION=${{ matrix.spark-version }} SCALA_VERSION=${{ matrix.scala-version }}
      - name: Build Glue/S3 test image
        run: |
          make docker-build-test \
            SPARK_VERSION=${{ matrix.spark-version }} \
            SCALA_VERSION=${{ matrix.scala-version }} \
            LANCE_NAMESPACE_IMPL_VERSION=${{ steps.docker-args.outputs.lance-namespace-impl-version }}
      - name: Run Glue/S3 Docker integration tests
        env:
          TEST_BACKENDS: ${{ matrix.test-backends }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
          AWS_GLUE_CATALOG_ID: ${{ secrets.AWS_GLUE_CATALOG_ID }}
          AWS_GLUE_ENDPOINT: ${{ secrets.AWS_GLUE_ENDPOINT }}
        run: |
          if [ -z "${AWS_S3_BUCKET_NAME}" ] || [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${AWS_SECRET_ACCESS_KEY}" ] || [ -z "${AWS_REGION}" ]; then
            echo "AWS_S3_BUCKET_NAME, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, and AWS_REGION secrets are required for Glue/S3 integration tests"
            exit 1
          fi
          make docker-test \
            SPARK_VERSION=${{ matrix.spark-version }} \
            SCALA_VERSION=${{ matrix.scala-version }} \
            TEST_BACKENDS=${{ matrix.test-backends }}
