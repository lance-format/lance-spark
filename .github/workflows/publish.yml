name: Publish Spark packages
on:
  release:
    types: [published]
  pull_request:
    paths:
      - .github/workflows/publish.yml
    types:
      - opened
      - synchronize
      - ready_for_review
      - reopened
  workflow_dispatch:
    inputs:
      mode:
        description: 'Release mode'
        required: true
        type: choice
        default: dry_run
        options:
          - dry_run
          - release
      ref:
        description: 'The branch, tag or SHA to checkout'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.ref || github.sha }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Spark
    runs-on: ubuntu-24.04
    # The plugin waits up to 30 minutes for each of the seven publishes.
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # When triggered by a release, use the release tag
          # When triggered manually, use the provided ref
          ref: ${{ github.event.release.tag_name || inputs.ref }}
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 17
          cache: "maven"
          server-id: ossrh
          server-username: SONATYPE_USER
          server-password: SONATYPE_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Set github
        run: |
          git config --global user.email "Lance Github Runner"
          git config --global user.name "dev+gha@lancedb.com"
      - name: Dry run
        if: |
          github.event_name == 'pull_request' ||
          inputs.mode == 'dry_run'
        run: |
          ./mvnw --batch-mode -DskipTests package
      - name: Publish to Maven Central
        if: |
          github.event_name == 'release' ||
          inputs.mode == 'release'
        run: |
          # setup-java 6 imports the signing key into an isolated GNUPGHOME.
          gpg_home="${GNUPGHOME:-$HOME/.gnupg}"
          mkdir -p "$gpg_home"
          chmod 700 "$gpg_home"
          printf '%s\n' "use-agent" "pinentry-mode loopback" >> "$gpg_home/gpg.conf"
          export GPG_TTY=$(tty)
          # Upload one bundle at a time to stay under Maven Central's 1GB zip limit.
          for bundle in lance-spark-bundle-*; do
            ./mvnw --batch-mode -DskipTests -DpushChanges=false \
              -Dgpg.passphrase="${GPG_PASSPHRASE}" \
              deploy -P deploy-to-ossrh \
              -DignorePublishedComponents=true \
              -DwaitUntil=published \
              -pl ":${bundle}" -am
          done
        env:
          SONATYPE_USER: ${{ secrets.SONATYPE_USER }}
          SONATYPE_TOKEN: ${{ secrets.SONATYPE_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
