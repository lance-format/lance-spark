name: Spark Search Docker

on:
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
      - reopened
    paths:
      - ".github/workflows/spark-search.yml"
      - "Makefile"
      - "docker/**"
      - "integration-tests/**"
      - "lance-spark-base_2.12/src/main/java/org/lance/spark/search/**"
      - "lance-spark-base_2.12/src/main/scala/org/lance/spark/search/**"
      - "lance-spark-base_2.12/src/test/java/org/lance/spark/search/**"
      - "lance-spark-*/src/main/scala/org/lance/spark/extensions/**"
      - "pom.xml"
      - "*/pom.xml"
  workflow_dispatch:
    inputs:
      spark-version:
        description: "Spark version to test"
        required: true
        default: "3.5"
      scala-version:
        description: "Scala version to test"
        required: true
        default: "2.13"
      backends:
        description: "Comma-separated test backends: local or local,rest-dir"
        required: true
        default: "local,rest-dir"
      rest-uri:
        description: "Existing REST namespace URI. Leave empty to build and start Sophon Phalanx."
        required: false
        default: ""
      rest-database:
        description: "x-lancedb-database header for rest-dir"
        required: false
        default: "lance_spark_ci"
      docker-run-args:
        description: "Extra docker run args for docker-test"
        required: false
        default: ""
      sophon-ref:
        description: "Sophon ref to build when rest-uri is empty"
        required: false
        default: "main"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "1"
  RUSTFLAGS: "-C debuginfo=line-tables-only -C opt-level=1"
  SPARK_VERSION: ${{ github.event.inputs['spark-version'] || '3.5' }}
  SCALA_VERSION: ${{ github.event.inputs['scala-version'] || '2.13' }}
  SEARCH_TEST_BACKENDS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.backends || 'local' }}
  SEARCH_PYTEST_CMD: >-
    pytest /home/lance/tests/test_lance_spark.py::TestDQLSearchTableFunctions
    -v --timeout=180

jobs:
  search-docker-test:
    name: Search Docker Test Spark ${{ env.SPARK_VERSION }} / Scala ${{ env.SCALA_VERSION }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: "maven"
      - name: Resolve Docker build args
        id: docker-args
        run: |
          make print-docker-build-args SPARK_VERSION=${SPARK_VERSION} SCALA_VERSION=${SCALA_VERSION} >> $GITHUB_OUTPUT
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build test-base image (cached)
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile.test-base
          load: true
          tags: lance-spark-test-base:${{ env.SPARK_VERSION }}_${{ env.SCALA_VERSION }}
          build-args: |
            SPARK_DOWNLOAD_VERSION=${{ steps.docker-args.outputs.spark-download-version }}
            SPARK_MAJOR_VERSION=${{ env.SPARK_VERSION }}
            SCALA_VERSION=${{ env.SCALA_VERSION }}
            PY4J_VERSION=${{ steps.docker-args.outputs.py4j-version }}
            SPARK_SCALA_SUFFIX=${{ steps.docker-args.outputs.spark-scala-suffix }}
          cache-from: type=gha,scope=search-test-base-${{ env.SPARK_VERSION }}_${{ env.SCALA_VERSION }}
          cache-to: type=gha,mode=max,scope=search-test-base-${{ env.SPARK_VERSION }}_${{ env.SCALA_VERSION }}
      - name: Build bundle
        run: make bundle SPARK_VERSION=${SPARK_VERSION} SCALA_VERSION=${SCALA_VERSION}
      - name: Build test image
        run: |
          make docker-build-test \
            SPARK_VERSION=${SPARK_VERSION} \
            SCALA_VERSION=${SCALA_VERSION} \
            LANCE_NAMESPACE_IMPL_VERSION=${{ steps.docker-args.outputs.lance-namespace-impl-version }}
      - name: Run directory namespace search tests
        if: ${{ contains(env.SEARCH_TEST_BACKENDS, 'local') }}
        run: |
          make docker-test \
            SPARK_VERSION=${SPARK_VERSION} \
            SCALA_VERSION=${SCALA_VERSION} \
            TEST_BACKENDS=local \
            PYTEST_CMD="${SEARCH_PYTEST_CMD}"
      - name: Resolve REST namespace server
        id: rest
        if: ${{ contains(env.SEARCH_TEST_BACKENDS, 'rest-dir') }}
        env:
          INPUT_REST_URI: ${{ github.event.inputs['rest-uri'] }}
          INPUT_DOCKER_RUN_ARGS: ${{ github.event.inputs['docker-run-args'] }}
          SOPHON_REPO_TOKEN: ${{ secrets.SOPHON_REPO_TOKEN }}
        run: |
          rest_uri="${INPUT_REST_URI}"
          docker_run_args="${INPUT_DOCKER_RUN_ARGS}"
          start_sophon=false

          if [ -z "${rest_uri}" ]; then
            if [ -z "${SOPHON_REPO_TOKEN}" ]; then
              echo "::error::rest-dir requires either workflow input rest-uri or repository secret SOPHON_REPO_TOKEN"
              exit 1
            fi
            rest_uri="http://host.docker.internal:10024"
            docker_run_args="${docker_run_args:+${docker_run_args} }--add-host=host.docker.internal:host-gateway"
            start_sophon=true
          fi

          echo "uri=${rest_uri}" >> "$GITHUB_OUTPUT"
          echo "start_sophon=${start_sophon}" >> "$GITHUB_OUTPUT"
          {
            echo "docker_run_args<<EOF"
            echo "${docker_run_args}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Checkout Sophon
        if: ${{ steps.rest.outputs.start_sophon == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: lancedb/sophon
          ref: ${{ github.event.inputs['sophon-ref'] || 'main' }}
          path: sophon
          token: ${{ secrets.SOPHON_REPO_TOKEN }}
          submodules: recursive
      - name: Build Sophon Phalanx image
        if: ${{ steps.rest.outputs.start_sophon == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: sophon
          file: sophon/docker/phalanx.Dockerfile
          target: phalanx-runtime
          load: true
          tags: sophon-phalanx:local
          build-args: |
            CARGO_PROFILE=dev
            RUSTFLAGS=${{ env.RUSTFLAGS }}
            CARGO_BUILD_JOBS=${{ env.CARGO_BUILD_JOBS }}
            TARGET_CPU=generic
          cache-from: type=gha,scope=sophon-phalanx-dir-rest
          cache-to: type=gha,mode=max,scope=sophon-phalanx-dir-rest
      - name: Start Sophon Phalanx
        if: ${{ steps.rest.outputs.start_sophon == 'true' }}
        run: |
          docker rm -f phalanx >/dev/null 2>&1 || true
          docker run -d --name phalanx -p 10024:10024 \
            -e PHALANX_ROOT_URI=/tmp/phalanx/root_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT} \
            -e PHALANX_TMP_URI=/tmp/phalanx/tmp \
            -e PHALANX_CACHE_DIR=/tmp/phalanx/cache \
            -e PHALANX_MAGIC_TOKENS=sk_localtest \
            -e PHALANX_EVENT_BUS_TYPE=stdout \
            -e RUST_LOG=info \
            -e RUST_BACKTRACE=full \
            sophon-phalanx:local \
            --stack-name=local-minimum

          for _ in $(seq 1 90); do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/10024' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done

          docker logs phalanx || true
          exit 1
      - name: Run REST directory namespace search tests
        if: ${{ contains(env.SEARCH_TEST_BACKENDS, 'rest-dir') }}
        env:
          LANCE_SPARK_REST_URI: ${{ steps.rest.outputs.uri }}
          LANCE_SPARK_REST_API_KEY: ${{ secrets.LANCE_SPARK_REST_API_KEY || 'sk_localtest' }}
          LANCE_SPARK_REST_DATABASE: ${{ github.event.inputs['rest-database'] || 'lance_spark_ci' }}
          DOCKER_RUN_ARGS: ${{ steps.rest.outputs.docker_run_args }}
        run: |
          make docker-test \
            SPARK_VERSION=${SPARK_VERSION} \
            SCALA_VERSION=${SCALA_VERSION} \
            TEST_BACKENDS=rest-dir \
            LANCE_SPARK_REST_URI="${LANCE_SPARK_REST_URI}" \
            LANCE_SPARK_REST_API_KEY="${LANCE_SPARK_REST_API_KEY}" \
            LANCE_SPARK_REST_DATABASE="${LANCE_SPARK_REST_DATABASE}" \
            DOCKER_RUN_ARGS="${DOCKER_RUN_ARGS}" \
            PYTEST_CMD="${SEARCH_PYTEST_CMD}"
      - name: Dump Phalanx logs
        if: ${{ always() && steps.rest.outputs.start_sophon == 'true' }}
        run: docker logs phalanx || true
